<p class="experience-status">
    <button type="button"
            class="button button-danger"
            popovertarget="delete-exp-{{ experience.id }}"
            aria-label="Hapus {{ experience.title }}"
            title="Hapus Pengalaman">
        Hapus Pengalaman
    </button>
</p>

<div id="delete-exp-{{ experience.id }}"
     class="experience-delete-modal"
     popover="auto"
     role="dialog"
     aria-modal="true"
     aria-labelledby="delete-exp-title-{{ experience.id }}">
    <button type="button"
            class="experience-delete-modal__backdrop"
            popovertarget="delete-exp-{{ experience.id }}"
            popovertargetaction="hide"
            aria-label="Tutup konfirmasi hapus"></button>
    <div class="experience-delete-modal__content">
        <button type="button"
                class="experience-delete-modal__close"
                popovertarget="delete-exp-{{ experience.id }}"
                popovertargetaction="hide"
                aria-label="Tutup konfirmasi hapus">×</button>
        <h2 id="delete-exp-title-{{ experience.id }}">Hapus Pengalaman?</h2>
        <p>
            Apakah Anda yakin ingin menghapus 
            <strong>{{ experience.title }}</strong>?
        </p>
        <form method="post" action="{% url 'main:delete_experience' experience.id %}" class="modal-form">
            {% csrf_token %}
            <div class="modal-input-group">
                <input type="password" 
                       name="secret_key" 
                       placeholder="Masukkan Kode Rahasia" 
                       required 
                       class="experience-search__input modal-secret-input">
            </div>
            
            <div class="experience-delete-modal__actions">
                <button type="button"
                        class="button button-secondary"
                        popovertarget="delete-exp-{{ experience.id }}"
                        popovertargetaction="hide">Batal</button>
                <button type="submit" class="button button-danger">Ya, Hapus</button>
            </div>
        </form>
    </div>
</div>
